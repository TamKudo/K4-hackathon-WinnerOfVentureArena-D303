services:
  - type: web
    name: lecturefocus-webapp
    runtime: node
    plan: free
    rootDir: codebase/webapp
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: npm start --prefix server
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false # nhập tay trong Render dashboard — không commit key vào repo
